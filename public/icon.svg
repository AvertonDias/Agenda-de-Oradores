<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Beautiful emerald green gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Subtle drop shadow for the icon elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Smooth rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Stylized Icon Group (Calendar + Speech/Microphone) with shadow -->
  <g filter="url(#dropShadow)" transform="translate(106, 106)">
    <!-- Calendar base (rounded card) -->
    <rect x="0" y="30" width="300" height="270" rx="40" fill="none" stroke="#ffffff" stroke-width="24" stroke-linejoin="round" />
    
    <!-- Calendar top bar / binding -->
    <line x1="0" y1="100" x2="300" y2="100" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    
    <!-- Calendar rings / hangers -->
    <rect x="60" y="0" width="24" height="60" rx="12" fill="#ffffff" />
    <rect x="216" y="0" width="24" height="60" rx="12" fill="#ffffff" />

    <!-- Stylized Microphone inside the calendar representing "Oradores" (Speakers) -->
    <g transform="translate(150, 195)">
      <!-- Mic Head -->
      <rect x="-30" y="-60" width="60" height="90" rx="30" fill="#ffffff" />
      
      <!-- Mic Stand / U-shape holder -->
      <path d="M -48 -20 A 48 48 0 0 0 48 -20" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
      
      <!-- Mic Base Stand -->
      <line x1="0" y1="28" x2="0" y2="60" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
      <line x1="-40" y1="60" x2="40" y2="60" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    </g>
  </g>
</svg>
